databaseChangeLog:
# Release v1.7 — message_templates (texts of WhatsApp / SMS editable by the admin) and the invitation notification types.
# Runs AFTER the v1.6 tag. Order: tables → alter (FK, CHECK) → tag.

  - includeAll:
      path: 01-ddl/03-tables/
